<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Encore Sessions - Join Room</title>
    <link
      rel="shortcut icon"
      href="https://encorekaraoke.org/assets/favicon.ico"
      type="image/x-icon"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Radio+Canada:wght@400;500;600;700&family=Rajdhani:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
    <script
      type="module"
      src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"
    ></script>
    <script
      nomodule
      src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"
    ></script>

    <style>
      :root {
        --bg-color: #080810;
        --card-bg: rgba(15, 15, 25, 0.2);
        --primary: #89cff0;
        --secondary: #ffd700;
        --danger: #ff5555;
        --success: #55ff55;
        --text: #ffffff;
        --text-dim: rgba(255, 255, 255, 0.6);
        --border: rgba(137, 207, 240, 0.3);
        --radius: 16px;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      h1,
      h2,
      h3,
      h4,
      .nav-logo,
      .btn {
        font-family: "Rajdhani", sans-serif;
        font-weight: 700;
      }

      a {
        text-decoration: none;
        color: inherit;
      }

      nav {
        position: fixed;
        top: 0;
        width: 100%;
        padding: 3em 4rem;
        display: flex;
        justify-content: space-between;
        align-items: center;
        z-index: 1000;
      }

      .nav-logo {
        font-size: 2.4rem;
        letter-spacing: 2px;
        text-transform: uppercase;
      }

      .nav-links {
        display: flex;
        gap: 2.5rem;
        align-items: center;
      }

      .nav-links a {
        font-family: "Rajdhani", sans-serif;
        font-size: 1.2rem;
        font-weight: 600;
        color: var(--text-dim);
        transition: all 0.3s;
        text-transform: uppercase;
        letter-spacing: 1px;
      }

      .nav-links a:hover {
        color: var(--text-main);
        text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
      }

      body {
        font-family: "Radio Canada", sans-serif;
        background-color: var(--bg-color);
        color: var(--text);
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
        background-image: radial-gradient(
          circle at center,
          rgba(137, 207, 240, 0.08) 0%,
          transparent 70%
        );
        overflow-x: hidden;
      }

      #constellation-bg {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 0;
        pointer-events: none;
        will-change: transform, opacity;
      }

      .app-header {
        margin-bottom: 2rem;
        text-align: center;
      }

      .app-header h1 {
        font-family: "Rajdhani", sans-serif;
        font-size: 2.8rem;
        font-weight: 800;
        color: var(--primary);
        letter-spacing: 0.05em;
        text-shadow: 0 0 20px rgba(137, 207, 240, 0.5);
      }

      .app-header p {
        font-size: 1.1rem;
        color: var(--secondary);
        letter-spacing: 0.1em;
        font-weight: 600;
        margin-top: 0.25rem;
        text-transform: uppercase;
      }

      .card {
        background: var(--card-bg);
        border: 2px solid var(--border);
        border-radius: var(--radius);
        width: 100%;
        max-width: 520px;
        padding: 2.5rem 2rem;
        text-align: center;
        box-shadow: 0 15px 40px rgba(0, 0, 0, 0.8);
        backdrop-filter: blur(15px) brightness(150%);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1.5rem;
        position: relative;
      }

      .icon-badge {
        font-size: 4rem;
        color: var(--primary);
        filter: drop-shadow(0 0 12px rgba(137, 207, 240, 0.5));
        line-height: 1;
      }

      .card-title {
        font-family: "Rajdhani", sans-serif;
        font-size: 2.2rem;
        font-weight: 800;
        color: var(--secondary);
        letter-spacing: 0.08em;
      }

      .card-desc {
        font-size: 1.15rem;
        color: var(--text-dim);
        line-height: 1.5;
        max-width: 400px;
      }

      .btn {
        font-family: "Rajdhani", sans-serif;
        font-size: 1.4rem;
        font-weight: 800;
        letter-spacing: 0.05em;
        width: 100%;
        height: 60px;
        border-radius: 10px;
        border: none;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
        transition: all 0.2s ease;
        text-decoration: none;
      }

      .btn-primary {
        background: var(--primary);
        color: #080810;
        box-shadow: 0 0 20px rgba(137, 207, 240, 0.3);
      }

      .btn-primary:hover {
        transform: translateY(-2px);
        box-shadow: 0 0 30px rgba(137, 207, 240, 0.5);
      }

      .btn-primary:active {
        transform: translateY(0);
      }

      .help-text {
        font-size: 0.9rem;
        color: var(--text-dim);
        margin-top: -0.5rem;
      }

      .error-box {
        display: none;
        flex-direction: column;
        align-items: center;
        gap: 1rem;
      }

      .error-box .icon-badge {
        color: var(--danger);
        filter: drop-shadow(0 0 12px rgba(255, 85, 85, 0.5));
      }

      .error-box .card-title {
        color: var(--danger);
      }
    </style>
  </head>
  <body>
    <nav>
      <a class="nav-logo" href="https://www.encorekaraoke.org" target="_blank"
        >Encore</a
      >
    </nav>
    <canvas id="constellation-bg"></canvas>
    <main class="card">
      <div
        id="join-view"
        style="
          display: flex;
          flex-direction: column;
          align-items: center;
          gap: 1.5rem;
          width: 100%;
        "
      >
        <ion-icon name="people" class="icon-badge"></ion-icon>

        <div class="card-title">SESSION INVITE</div>

        <div class="card-desc">
          You've been invited to join a remote karaoke room in Encore.
        </div>

        <button class="btn btn-primary" id="open-btn">
          <ion-icon name="open-outline" style="font-size: 1.6rem"></ion-icon>
          <span>OPEN ENCORE APP</span>
        </button>

        <div class="help-text">
          If the app didn't open automatically, click the button above.
        </div>
      </div>

      <div id="error-view" class="error-box">
        <ion-icon name="alert-circle" class="icon-badge"></ion-icon>
        <div class="card-title">INVALID LINK</div>
        <div class="card-desc">
          No valid session room code was found in the URL. Please check your
          invite link and try again.
        </div>
      </div>
    </main>

    <script>
      /**
       * Extracts the Room Code from either Netlify route path (/join/<roomCode>)
       * or query parameter (?room=<roomCode> / ?code=<roomCode>).
       */
      function getRoomCode() {
        const urlParams = new URLSearchParams(window.location.search);
        let room = urlParams.get("room");
        if (room && room.trim()) return room.trim();

        const pathSegments = window.location.pathname
          .split("/")
          .filter(Boolean);
        const joinIndex = pathSegments.indexOf("join");

        if (joinIndex !== -1 && pathSegments[joinIndex + 1]) {
          return pathSegments[joinIndex + 1].trim();
        }

        const lastSegment = pathSegments[pathSegments.length - 1];
        if (
          lastSegment &&
          lastSegment !== "join" &&
          lastSegment !== "join.html"
        ) {
          return lastSegment.trim();
        }

        return null;
      }

      async function checkAppHealth() {
        try {
          const controller = new AbortController();
          const timeoutId = setTimeout(() => controller.abort(), 2000);

          const res = await fetch("http://127.0.0.1:9864/local_ip", {
            cache: "no-store",
            signal: controller.signal,
          });
          clearTimeout(timeoutId);

          return res.ok;
        } catch (e) {
          return false;
        }
      }

      document.addEventListener("DOMContentLoaded", async () => {
        const roomCode = getRoomCode();
        const joinView = document.getElementById("join-view");
        const errorView = document.getElementById("error-view");
        const openBtn = document.getElementById("open-btn");

        if (!roomCode) {
          joinView.style.display = "none";
          errorView.style.display = "flex";
          return;
        }

        const deepLinkUrl = `encore://session/${encodeURIComponent(roomCode)}`;

        function triggerDeepLink() {
          window.location.href = deepLinkUrl;
        }

        openBtn.addEventListener("click", triggerDeepLink);

        if (await checkAppHealth()) {
          triggerDeepLink();
        }
      });
    </script>
    <script>
      const observerOptions = {
        root: null,
        rootMargin: "0px",
        threshold: 0.1,
      };

      const observer = new IntersectionObserver((entries, observer) => {
        entries.forEach((entry) => {
          if (entry.isIntersecting) {
            entry.target.classList.add("show");
            observer.unobserve(entry.target);
          }
        });
      }, observerOptions);

      document.querySelectorAll(".scroll-anim").forEach((elem) => {
        observer.observe(elem);
      });

      const canvas = document.getElementById("constellation-bg");
      const ctx = canvas.getContext("2d");

      let width, height;
      let stars = [];

      const mouse = {
        x: null,
        y: null,
        radius: 120, // How far the mouse repels stars
      };

      window.addEventListener("mousemove", (e) => {
        const rect = canvas.getBoundingClientRect();
        mouse.x = e.clientX - rect.left;
        mouse.y = e.clientY - rect.top;
      });

      window.addEventListener("mouseout", () => {
        mouse.x = null;
        mouse.y = null;
      });

      function resize() {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
      }
      window.addEventListener("resize", resize);
      resize();

      class Star {
        constructor() {
          this.x = Math.random() * width;
          this.y = Math.random() * height;

          this.originX = this.x;
          this.originY = this.y;

          this.vx = 0;
          this.vy = 0;

          this.friction = 0.6;
          this.spring = 0.03;

          this.radius = Math.random() * 3 + 0.2;
          this.baseAlpha = Math.random() * 0.6 + 0.1;
          this.twinkleSpeed = Math.random() * 0.03 + 0.005;
          this.time = Math.random() * Math.PI * 2;
        }

        update() {
          const dxOrigin = this.originX - this.x;
          const dyOrigin = this.originY - this.y;
          this.vx += dxOrigin * this.spring;
          this.vy += dyOrigin * this.spring;

          if (mouse.x !== null && mouse.y !== null) {
            const dxMouse = this.x - mouse.x;
            const dyMouse = this.y - mouse.y;
            const distance = Math.sqrt(dxMouse * dxMouse + dyMouse * dyMouse);

            if (distance < mouse.radius) {
              const force = (mouse.radius - distance) / mouse.radius;
              this.vx += (dxMouse / distance) * force * 1.5;
              this.vy += (dyMouse / distance) * force * 1.5;
            }
          }

          this.vx *= this.friction;
          this.vy *= this.friction;
          this.x += this.vx;
          this.y += this.vy;

          this.time += this.twinkleSpeed;
        }

        draw() {
          let alpha = this.baseAlpha + Math.sin(this.time) * 0.4;
          alpha = Math.max(0, Math.min(1, alpha));

          let ratio = this.x / width;
          ratio = Math.max(0, Math.min(1, ratio));

          // Color 1 (Left): Light Yellow (Hoshi)
          const r1 = 255,
            g1 = 240,
            b1 = 150;
          // Color 2 (Right): Light Blue (Kai)
          const r2 = 137,
            g2 = 207,
            b2 = 240;

          const r = Math.round(r1 + (r2 - r1) * ratio);
          const g = Math.round(g1 + (g2 - g1) * ratio);
          const b = Math.round(b1 + (b2 - b1) * ratio);

          ctx.beginPath();
          ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(${r}, ${g}, ${b}, ${alpha})`;
          ctx.fill();
        }
      }

      function initParticles() {
        stars = [];
        const particleCount = Math.min(Math.floor(window.innerWidth / 5), 400);
        for (let i = 0; i < particleCount; i++) {
          stars.push(new Star());
        }
      }
      initParticles();

      function animate() {
        ctx.clearRect(0, 0, width, height);

        stars.forEach((star) => {
          star.update();
          star.draw();
        });

        requestAnimationFrame(animate);
      }
      animate();

      let resizeTimeout;
      window.addEventListener("resize", () => {
        clearTimeout(resizeTimeout);
        resizeTimeout = setTimeout(() => {
          initParticles();
        }, 200);
      });
    </script>
  </body>
</html>
